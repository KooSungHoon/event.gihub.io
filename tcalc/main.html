<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Calculator</title>
  <link rel="stylesheet" href="../tcalc/main.css">
  <script src="../tcalc/jquery.js"></script>
  <script src="../tcalc/main.js"></script>
</head>
<body>

<div class="container">
  <h2>Time Calculator ⏱️</h2>
  <div class="field">
    <label for="endTime">종료시간</label>
    <input type="numeric" inputmode="numeric" autocomplete="off" class="time-input" id="endTime" placeholder="종료시간을 입력해주세요">
  </div>
  <div class="field">
    <label for="reqTime">요청시간</label>
    <input type="numeric" inputmode="numeric" autocomplete="off" class="time-input" id="reqTime" placeholder="요청시간을 입력해주세요">
  </div>
  <div class="result-box">
    <div class="result-wrap">
        <div class="result-time" id="resultText">--:--</div>
        <button id="resetBtn">리셋</button>
    </div>
    <div class="sub-text">종료시간에서 요청시간을 차감한 시간</div>
  </div>
</div>

</body>
</html>
